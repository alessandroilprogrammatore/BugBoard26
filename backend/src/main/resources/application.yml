server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/devdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2

app:
  jwt:
    secret: "ThisIsAVeryLongAndSecureJWTSecretKeyThatIsAtLeast32CharactersLongForSecurity123456789"
    ttl-hours: 8

  front-origin: "http://localhost:8080"

  cookie:
    secure: false
    samesite: Lax

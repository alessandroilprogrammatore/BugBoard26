services:
  db:
    image: postgres:16-alpine
    container_name: bugboard-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bugboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bugboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugboard} -d ${POSTGRES_DB:-bugboard}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bugboard-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bugboard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bugboard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET}
      APP_FRONT_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN}
      APP_COOKIE_SECURE: "true"
      APP_COOKIE_SAMESITE: Lax
      APP_SECURITY_ALLOW_LOCAL_ORIGINS: "false"
      APP_SECURITY_EXPOSE_DOCS: "${APP_SECURITY_EXPOSE_DOCS:-false}"
      APP_SECURITY_EXPOSE_H2_CONSOLE: "false"
    expose:
      - "8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    container_name: bugboard-frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:

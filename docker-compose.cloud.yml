services:
  db:
    image: postgres:16-alpine
    container_name: bugboard-db
    environment:
      POSTGRES_USER: bug
      POSTGRES_PASSWORD: bug
      POSTGRES_DB: bugboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bug -d bugboard"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bugboard-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bugboard
      SPRING_DATASOURCE_USERNAME: bug
      SPRING_DATASOURCE_PASSWORD: bug
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ThisIsAVeryLongAndSecureJWTSecretKeyThatIsAtLeast32CharactersLongForSecurity123456789}
      APP_FRONT_ORIGIN: ${APP_FRONT_ORIGIN:-http://34.77.106.57:5173}
      APP_COOKIE_SECURE: "${APP_COOKIE_SECURE:-false}"
      APP_COOKIE_SAMESITE: ${APP_COOKIE_SAMESITE:-Lax}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bugboard-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_BACKEND_PROXY_TARGET: http://backend:8081
    depends_on:
      - backend

volumes:
  pgdata:

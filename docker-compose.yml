version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bugboard-db
    environment:
      POSTGRES_USER: bug
      POSTGRES_PASSWORD: bug
      POSTGRES_DB: bugboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bug -d bugboard" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bugboard-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bugboard
      SPRING_DATASOURCE_USERNAME: bug
      SPRING_DATASOURCE_PASSWORD: bug
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ThisIsAVeryLongAndSecureJWTSecretKeyThatIsAtLeast32CharactersLongForSecurity123456789}
      APP_FRONT_ORIGIN: ${APP_FRONT_ORIGIN:-http://localhost:5173}
      APP_COOKIE_SECURE: "${APP_COOKIE_SECURE:-false}"
      APP_COOKIE_SAMESITE: ${APP_COOKIE_SAMESITE:-Lax}
      APP_SECURITY_ALLOW_LOCAL_ORIGINS: "${APP_SECURITY_ALLOW_LOCAL_ORIGINS:-true}"
      APP_SECURITY_EXPOSE_DOCS: "${APP_SECURITY_EXPOSE_DOCS:-true}"
      APP_SECURITY_EXPOSE_H2_CONSOLE: "${APP_SECURITY_EXPOSE_H2_CONSOLE:-true}"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/auth/me || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ] || [ \"$$code\" = \"403\" ]"
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bugboard-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_BACKEND_PROXY_TARGET: http://backend:8081
    depends_on:
      - backend

  sonarqube:
    image: sonarqube:10-community
    container_name: bugboard-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  pgdata:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

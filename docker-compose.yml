version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bugboard-db
    environment:
      POSTGRES_USER: bug
      POSTGRES_PASSWORD: bug
      POSTGRES_DB: bugboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bug -d bugboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bugboard-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bugboard
      SPRING_DATASOURCE_USERNAME: bug
      SPRING_DATASOURCE_PASSWORD: bug
      APP_JWT_SECRET: change-me-in-production
      APP_FRONT_ORIGIN: http://localhost:5173
      APP_COOKIE_SECURE: "false"
      APP_COOKIE_SAMESITE: Lax
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bugboard-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
